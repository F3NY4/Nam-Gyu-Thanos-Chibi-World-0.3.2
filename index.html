function drawAvatar(p,isMe){ctx.save();ctx.translate(p.x,p.y);const moving=p.action==='walk'||p.action==='dance';const bob=moving?Math.sin(performance.now()/115)*2.2:Math.sin(performance.now()/800)*.7;ctx.translate(0,bob);if(p.dir<0)ctx.scale(-1,1);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,27,29,10,0,0,Math.PI*2);ctx.fill();
 const skin=p.character==='namgyu'?'#f0c8ad':'#edc0a4';let shirt=p.character==='namgyu'?'#24232b':'#f4bf35';if(p.outfit==='cold')shirt='#273244';if(p.outfit==='hot')shirt=p.character==='namgyu'?'#5e6570':'#f4bf35';if(p.outfit==='sleep')shirt='#f0d9d0';if(p.outfit==='bath')shirt='#fff7f2';
 ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-20,-7,40,39,12);ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-27,21,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle=p.character==='namgyu'?'#252229':'#713c91';ctx.beginPath();if(p.character==='namgyu'){ctx.arc(0,-34,22,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-21,-34,42,11)}else{ctx.arc(0,-35,23,Math.PI,Math.PI*2);ctx.fill();for(let i=-18;i<19;i+=9){ctx.beginPath();ctx.moveTo(i,-34);ctx.lineTo(i+4,-53);ctx.lineTo(i+10,-34);ctx.fill()}}
 // expressive action pose
 if(p.action==='hug'){ctx.strokeStyle=skin;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-17,3);ctx.quadraticCurveTo(-29,12,-20,22);ctx.moveTo(17,3);ctx.quadraticCurveTo(29,12,20,22);ctx.stroke()}
 if(p.action==='kiss'){ctx.strokeStyle=skin;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(16,2);ctx.lineTo(28,-3);ctx.stroke()}
 if(p.action==='dance'){ctx.strokeStyle=skin;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-17,2);ctx.lineTo(-28,-12);ctx.moveTo(17,2);ctx.lineTo(29,-10);ctx.stroke()}
 // face
 ctx.fillStyle='#3a2a31';ctx.beginPath();ctx.arc(-7,-26,2.3,0,7);ctx.arc(7,-26,2.3,0,7);ctx.fill();ctx.strokeStyle='#9d626a';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,-20,5,.15,2.95);ctx.stroke();
 // legs / shoes, animated subtly
 const step=moving?Math.sin(performance.now()/115)*5:0;
 if(['cook','eat'].includes(p.action)){ctx.strokeStyle='#8b5b46';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(18,-2);ctx.lineTo(30,-15);ctx.stroke();ctx.fillStyle='#fff3';ctx.beginPath();ctx.arc(32,-17,6,0,7);ctx.fill()}
 if(p.action==='sleep'||p.action==='sleepTogether'){ctx.fillStyle='#fff7';ctx.beginPath();ctx.ellipse(0,35,31,11,0,0,7);ctx.fill()}
 if(p.action==='bath'){ctx.fillStyle='#fff';ctx.fillRect(-18,8,36,25)}
ctx.strokeStyle='#1d1b20';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-8,31);ctx.lineTo(-9-step,47);ctx.moveTo(8,31);ctx.lineTo(9+step,47);ctx.stroke();ctx.strokeStyle='#f4f4f1';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-10-step,48);ctx.lineTo(-20-step,48);ctx.moveTo(10+step,48);ctx.lineTo(20+step,48);ctx.stroke();ctx.strokeStyle='#202028';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-17-step,48);ctx.lineTo(-6-step,48);ctx.moveTo(6+step,48);ctx.lineTo(17+step,48);ctx.stroke();
 ctx.save();ctx.scale(p.dir,1);ctx.fillStyle='#fff';ctx.font='800 13px system-ui';ctx.textAlign='center';ctx.fillText(names[p.character],0,-61);ctx.restore();if(isMe){ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,37,0,7);ctx.stroke()}
 if(p.bubble&&p.bubbleUntil>Date.now())drawBubble(p.bubble);if(p.emote&&p.emoteUntil>Date.now())drawEmote(p.emote);ctx.restore()}
function drawBubble(text){ctx.save();ctx.scale(1,-1);ctx.translate(0,-92);ctx.scale(1,-1);ctx.font='600 13px system-ui';const max=180;let s=text;if(ctx.measureText(s).width>max){while(ctx.measureText(s+'…').width>max)s=s.slice(0,-1);s+='…'}const w=Math.min(max+22,ctx.measureText(s).width+22);ctx.fillStyle='#fffefb';ctx.strokeStyle='#ffffff99';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-w/2,-25,w,34,12);ctx.fill();ctx.stroke();ctx.fillStyle='#382d35';ctx.textAlign='center';ctx.fillText(s,0,-3);ctx.fillStyle='#fffefb';ctx.beginPath();ctx.moveTo(-7,8);ctx.lineTo(0,16);ctx.lineTo(8,8);ctx.fill();ctx.restore()}
function drawEmote(a){ctx.save();ctx.font='28px system-ui';ctx.textAlign='center';const y=-88-Math.sin(performance.now()/140)*5;const map={kiss:'💋',hug:'♥',highfive:'✋',heart:'♥',wave:'👋',laugh:'😂',dance:'♪',sleep:'💤',sit:'•'};ctx.fillText(map[a]||'♥',0,y);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const p=me();if(p){camera.x=clamp(p.x-W/2,0,WORLD.w-W);camera.y=clamp(p.y-H/2,0,WORLD.h-H)}ctx.save();ctx.translate(-camera.x,-camera.y);drawWorld();const currentScene=me()?.scene||'street';const arr=Object.values(players).filter(q=>(q.scene||'street')===currentScene).sort((a,b)=>a.y-b.y);for(const q of arr)drawAvatar(q,q.id===myId);ctx.restore()}
function hud(){const p=me(),o=other();if(!p)return;document.getElementById('meName').textContent=names[p.character];document.getElementById('stats').textContent='Энергия '+Math.round(p.energy)+' · Голод '+Math.round(p.hunger)+' · Настроение '+Math.round(p.mood);document.getElementById('roomHud').textContent='Комната: '+roomId+' · '+Object.keys(players).length+'/2';document.getElementById('otherHud').textContent=o?'♥ '+names[o.character]+' · '+sceneLabels[o.scene||'street']:'Друг: ждём второго игрока';updatePlaces();document.getElementById('clock').textContent=timeParts(worldTime)+' · '+(worldTime>=6&&worldTime<18?'день':worldTime>=18&&worldTime<21?'закат':'ночь')}
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();hud();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function toggleChat(v=!chatOpen){chatOpen=v;document.getElementById('chatbox').classList.toggle('hidden',!v);if(v)setTimeout(()=>document.getElementById('chatInput').focus(),40)}function toggleMenu(v=!menuOpen){menuOpen=v;document.getElementById('menu').classList.toggle('hidden',!v)}document.getElementById('menuBtn').onclick=()=>toggleMenu();document.getElementById('chatBtn').onclick=()=>{toggleMenu(false);toggleChat(true)};document.getElementById('send').onclick=sendChat;document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}});function sendChat(){const i=document.getElementById('chatInput'),t=i.value.trim();if(!t||!socket)return;socket.emit('chat',{text:t});i.value='';}
function sendAction(action){if(!socket)return;socket.emit('action',{action});if(action.startsWith('change')||['cook','bath','sleepTogether','eat'].includes(action))save()}
for(const b of document.querySelectorAll('[data-a]'))b.onclick=()=>sendAction(b.dataset.a);
for(const b of document.querySelectorAll('[data-i]'))b.onclick=()=>{if(!socket||!other())return;socket.emit('interaction',{type:b.dataset.i});};
for(const b of document.querySelectorAll('[data-place]'))b.onclick=()=>{if(!socket)return;socket.emit('sceneChange',{scene:b.dataset.place});};
function updatePlaces(){const p=me();document.querySelectorAll('[data-place]').forEach(b=>b.classList.toggle('active',p&&p.scene===b.dataset.place));}document.getElementById('saveBtn').onclick=()=>{save();banner('Комната сохранена на этом устройстве')};
setInterval(save,5000);window.addEventListener('beforeunload',save);

const sc=document.createElement('script');sc.src='/socket.io/socket.io.js';sc.onerror=()=>document.getElementById('chooseStatus').textContent='Не найден игровой сервер. Открой адрес Node/Socket.IO сервера.';document.head.appendChild(sc);
